name: Source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check -- --require-python
      - run: npm test
      - run: python -m unittest tests.model_download_test tests.multilingual_provision_test tests.asr_path_test tests.voice_compatibility_test tests.uv_retry_test tests.hub_download_messages_test tests.speech_language_test tests.voice_startup_failure_test
      - run: npm run format:check
      - run: npm run release:check
      - run: npm run verify:dimming
      - run: npm run verify:languages
      - run: node tools/verify/verify-companion-settings.mjs
      - run: node tools/verify/verify-spotify-settings.mjs
      - run: node tools/verify/verify-settings-lifecycle.mjs
      - run: node tools/verify/verify-settings-first-open.mjs
      - run: node tools/verify/verify-app-catalog-settings.mjs
      - run: node tools/verify/verify-button-feedback.mjs
      - run: node tools/verify/verify-text-selection.mjs
      - run: node tools/verify/verify-computer-control.mjs
      - run: node tools/verify/verify-inference-api.mjs
      - run: node tools/verify/verify-update-handoff.mjs
      - run: npm run verify:installer
      # Resolve the real locked voice environment from scratch without a GPU
      # or downloading speech weights; catch index/pin failures before release.
      - run: python -m pip install uv==0.13.5
      - run: uv venv .runtime/asr-checks
      - run: uv pip sync --python .runtime/asr-checks/Scripts/python.exe config/asr-requirements.lock.txt
      # Native VAD verification needs this 2.3 MB pinned model, not Parakeet/Whisper.
      - run: .runtime/asr-checks/Scripts/python.exe tools/setup/provision-streaming-asr.py --vad-only
      - run: .runtime/asr-checks/Scripts/python.exe -m unittest tests.asr_languages_test tests.asr_recognition_test
      - run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/setup/setup-voice-training.ps1 -PlanOnly
      - run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File tools/setup/setup-voice-training.ps1 -PlanOnly -VoiceRuntime blackwell
