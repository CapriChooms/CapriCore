<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'"
    />
    <link rel="stylesheet" href="minimized-chip.css" />
    <title>Capri</title>
    <link rel="icon" type="image/svg+xml" href="/brand/capricore.svg" />
  </head>
  <body>
    <button type="button" title="Show Capri" aria-label="Show Capri">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <defs>
          <clipPath id="chip-contour"><path d="M12 3H37V28L28 37H3V12Z" /></clipPath>
          <linearGradient id="chip-glint">
            <stop offset="0" stop-color="white" stop-opacity="0" />
            <stop offset="0.5" stop-color="white" stop-opacity="0.65" />
            <stop offset="1" stop-color="white" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path class="shell" d="M12 3H37V28L28 37H3V12Z" />
        <image class="core" href="/brand/capricore.svg" x="3" y="3" width="34" height="34" />
        <g clip-path="url(#chip-contour)">
          <rect class="sheen" x="-24" y="-8" width="18" height="56" fill="url(#chip-glint)" />
        </g>
      </svg>
    </button>
    <script type="module" src="minimized-chip.mjs"></script>
  </body>
</html>
