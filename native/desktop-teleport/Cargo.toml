[package]
name = "capri-desktop-teleport"
version = "0.1.0"
edition = "2024"
description = "Capri desktop teleport helper without global input hooks"
license = "GPL-3.0-only"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "capri-teleport"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
